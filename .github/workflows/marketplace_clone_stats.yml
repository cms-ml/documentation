name: Record marketplace clone stats

# GitHub keeps only 14 days of clone traffic, so this job saves it to
# content/marketplace/data/clones.json twice a week and redeploys the site.
#
# Needs the MARKETPLACE_TRAFFIC_TOKEN secret: a fine-grained token for the
# cms-ml organization with read-only "Administration" access to
# cms-ml/marketplace (the traffic API requires it).

on:
  schedule:
    - cron: "17 6 * * 1,4" # Mondays and Thursdays, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write # commit the updated record
  actions: write # start the deploy workflow

concurrency:
  group: marketplace-clone-stats
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Fetch clone traffic 📈
        env:
          GH_TOKEN: ${{ secrets.MARKETPLACE_TRAFFIC_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::The MARKETPLACE_TRAFFIC_TOKEN secret is not set"
            exit 1
          fi
          gh api repos/cms-ml/marketplace/traffic/clones > "$RUNNER_TEMP/clones-raw.json"

      - name: Update the record 📝
        run: python3 scripts/update_clone_stats.py "$RUNNER_TEMP/clones-raw.json"

      - name: Commit and redeploy 🚀
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- content/marketplace/data/clones.json; then
            echo "No new data"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/marketplace/data/clones.json
          git commit -m "Update marketplace clone stats"
          git push
          # Pushes made with the workflow token don't trigger other workflows,
          # so start the site deploy explicitly
          gh workflow run deploy_docs.yml --ref "$GITHUB_REF_NAME"
